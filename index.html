<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BioGC – Laboratory of Bioinformatics and Clinical Genomics | Fiocruz</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
    <style>
        /* Estilo rápido para o seletor de idioma e loading */
        #top-bar {
            background: #003f44;
            color: #fff;
            padding: 0.5rem 2rem;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 1rem;
            font-size: 0.9rem;
        }
        #top-bar select {
            background: transparent;
            color: #fff;
            border: 1px solid #fff;
            border-radius: 4px;
            padding: 0.2rem 0.5rem;
            cursor: pointer;
        }
        #top-bar select option {
            background: #003f44;
            color: #fff;
        }
        #loading-message {
            text-align: center;
            padding: 3rem 1rem;
            font-size: 1.2rem;
            color: #555;
        }
    </style>
</head>
<body>
    <!-- Barra superior com seletor de idioma -->
    <div id="top-bar">
        <span style="margin-right:auto; font-weight:300;">
            <i class="fas fa-flask"></i> BioGC
        </span>
        <label for="language-switcher" style="margin-right:0.3rem;">
            <i class="fas fa-globe"></i>
        </label>
        <select id="language-switcher" aria-label="Switch language">
            <option value="en">🇬🇧 EN</option>
            <option value="pt">🇧🇷 PT</option>
        </select>
    </div>

    <!-- Placeholders para os componentes carregados via JavaScript -->
    <div id="component-header"></div>
    <div id="component-hero"></div>

    <main>
        <!-- Mensagem de carregamento (será substituída) -->
        <div id="loading-message">
            <i class="fas fa-spinner fa-pulse"></i> Loading content...
        </div>

        <!-- Containers dinâmicos -->
        <div id="component-about"></div>
        <div id="component-team">
            <div id="equipe-container"></div>
        </div>
        <div id="component-announcements"></div>
        <div id="component-publications"></div>
        <div id="component-partners"></div>
        <div id="component-alumni">
            <div id="alumni-content">
                <div id="egressos-container"></div>
            </div>
        </div>
        <div id="component-contact"></div>
    </main>

    <div id="component-footer"></div>

    <!-- Carrega toda a lógica JavaScript como módulo -->
    <script src="js/site.js" type="module"></script>
</body>
</html>
