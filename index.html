<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BioGC – Laboratory of Bioinformatics and Clinical Genomics | Fiocruz</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
    <style>
        /* ---- Barra superior com seletor de idioma ---- */
        #top-bar {
            background: #003f44;
            color: #fff;
            padding: 0.5rem 2rem;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 1rem;
            font-size: 0.9rem;
        }
        #top-bar select {
            background: transparent;
            color: #fff;
            border: 1px solid #fff;
            border-radius: 4px;
            padding: 0.2rem 0.5rem;
            cursor: pointer;
        }
        #top-bar select option {
            background: #003f44;
            color: #fff;
        }

        /* ---- Logo (substitui o hero) ---- */
        #logo-container {
            text-align: center;
            padding: 2rem 1rem;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
        }
        #logo-container img {
            max-width: 320px;
            height: auto;
            display: block;
            margin: 0 auto;
        }
        #logo-container .subtitle {
            margin-top: 0.5rem;
            font-size: 1.1rem;
            color: #2d3748;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        /* ---- Loading ---- */
        #loading-message {
            text-align: center;
            padding: 3rem 1rem;
            font-size: 1.2rem;
            color: #555;
        }
    </style>
</head>
<body>

    <!-- ===== BARRA SUPERIOR ===== -->
    <div id="top-bar">
        <span style="margin-right:auto; font-weight:300;">
            <i class="fas fa-flask"></i> BioGC
        </span>
        <label for="language-switcher" style="margin-right:0.3rem;">
            <i class="fas fa-globe"></i>
        </label>
        <select id="language-switcher" aria-label="Switch language">
            <option value="en">🇬🇧 EN</option>
            <option value="pt">🇧🇷 PT</option>
        </select>
    </div>

    <!-- ===== HEADER (menu/navegação) ===== -->
    <div id="component-header"></div>

    <!-- ===== LOGO ===== -->
    <div id="logo-container">
        <img src="images/logo-biogc.png" alt="BioGC - Laboratory of Bioinformatics and Clinical Genomics" />
        <div class="subtitle">
            Laboratory of Bioinformatics and Clinical Genomics <br />
            <span style="font-size:0.9rem; color:#718096;">Fiocruz – Carlos Chagas Institute</span>
        </div>
    </div>

    <!-- ===== CONTEÚDO PRINCIPAL ===== -->
    <main>

        <!-- Mensagem de loading (será removida pelo JavaScript) -->
        <div id="loading-message">
            <i class="fas fa-spinner fa-pulse"></i> Loading content...
        </div>

        <!-- ===== SEÇÕES COM CONTAINERS ESPECÍFICOS ===== -->

        <!-- Sobre (estático) -->
        <div id="component-about"></div>

        <!-- Equipe (dinâmico – renderizado por team.js) -->
        <div id="component-team">
            <div id="equipe-container"></div>
        </div>

        <!-- Anúncios / Oportunidades -->
        <div id="component-announcements">
            <div id="announcements-container"></div>
        </div>

        <!-- Publicações -->
        <div id="component-publications">
            <div id="publicacoes-container"></div>
        </div>

        <!-- Parceiros -->
        <div id="component-partners">
            <div id="parceiros-container"></div>
        </div>

        <!-- Galeria (se tiver) -->
        <div id="component-gallery">
            <div id="galeria-container"></div>
        </div>

        <!-- Alumni -->
        <div id="component-alumni">
            <div id="alumni-content">
                <div id="egressos-container"></div>
            </div>
        </div>

        <!-- Contato (estático) -->
        <div id="component-contact"></div>

    </main>

    <!-- ===== RODAPÉ (estático) ===== -->
    <div id="component-footer"></div>

    <!-- ===== CARREGA O JAVASCRIPT PRINCIPAL ===== -->
    <script src="js/site.js" type="module"></script>

</body>
</html>
