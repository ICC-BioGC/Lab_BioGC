<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>BioGC – Laboratório de Bioinformática e Genômica Clínica | Fiocruz</title>
    <meta name="description" content="Laboratório de Bioinformática e Genômica Clínica (BioGC) do Instituto Carlos Chagas – Fiocruz.">
    <!-- CSS externo (mantém a formatação) -->
    <link rel="stylesheet" href="css/style.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <!-- Componentes estáticos carregados via JS -->
    <div id="component-header"></div>
    <div id="component-hero"></div>

    <main>
        <div id="component-sobre"></div>
        <div id="component-pesquisa"></div>

        <!-- Seções dinâmicas (preenchidas pelos JSONs) -->
        <section id="equipe" class="section">
            <div class="container">
                <h2>Equipe atual</h2>
                <div id="equipe-container" class="loading"><i class="fas fa-spinner fa-pulse"></i> Carregando...</div>
            </div>
        </section>

        <section id="egressos" class="section bg-light">
            <div class="container">
                <h2>Egressos</h2>
                <div id="egressos-container" class="loading"><i class="fas fa-spinner fa-pulse"></i> Carregando...</div>
            </div>
        </section>

        <section id="parceiros" class="section">
            <div class="container">
                <h2>Instituições parceiras</h2>
                <div id="parceiros-container" class="loading"><i class="fas fa-spinner fa-pulse"></i> Carregando...</div>
            </div>
        </section>

        <section id="publicacoes" class="section bg-light">
            <div class="container">
                <h2>Publicações recentes</h2>
                <div id="publicacoes-container" class="loading"><i class="fas fa-spinner fa-pulse"></i> Carregando...</div>
            </div>
        </section>

        <div id="component-contato"></div>
    </main>

    <div id="component-footer"></div>

    <script>
        // Função genérica para carregar componentes HTML
        async function loadComponent(elementId, filePath) {
            try {
                const response = await fetch(filePath);
                if (!response.ok) throw new Error(`Erro ao carregar ${filePath}`);
                const html = await response.text();
                document.getElementById(elementId).innerHTML = html;
            } catch (error) {
                console.error(`Falha ao carregar componente ${filePath}:`, error);
                document.getElementById(elementId).innerHTML = `<p style="color:red;">Erro ao carregar componente.</p>`;
            }
        }

        // Carregar todos os componentes estáticos
        async function loadAllComponents() {
            await loadComponent('component-header', 'components/header.html');
            await loadComponent('component-hero', 'components/hero.html');
            await loadComponent('component-sobre', 'components/sobre.html');
            await loadComponent('component-pesquisa', 'components/pesquisa.html');
            await loadComponent('component-contato', 'components/contato.html');
            await loadComponent('component-footer', 'components/footer.html');
        }

        // ========== Funções para dados dinâmicos (exatamente como antes) ==========
        let orientadoresMap = {};
        let allMembersForLinks = [];

        async function loadJSON(url) {
            try {
                const res = await fetch(url);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                return await res.json();
            } catch(e) {
                console.warn(`Erro ao carregar ${url}:`, e);
                return null;
            }
        }

        function renderSocialLinks(links) {
            let html = '<div class="social-links">';
            if (links.lattes) html += `<a href="${links.lattes}" target="_blank" title="Lattes"><i class="fab fa-lattes"></i></a>`;
            if (links.orcid) html += `<a href="${links.orcid}" target="_blank" title="ORCID"><i class="fab fa-orcid"></i></a>`;
            if (links.researchgate) html += `<a href="${links.researchgate}" target="_blank" title="ResearchGate"><i class="fab fa-researchgate"></i></a>`;
            if (links.google_scholar) html += `<a href="${links.google_scholar}" target="_blank" title="Google Scholar"><i class="fas fa-graduation-cap"></i></a>`;
            if (links.linkedin) html += `<a href="${links.linkedin}" target="_blank" title="LinkedIn"><i class="fab fa-linkedin"></i></a>`;
            if (links.instagram) html += `<a href="${links.instagram}" target="_blank" title="Instagram"><i class="fab fa-instagram"></i></a>`;
            if (links.github) html += `<a href="${links.github}" target="_blank" title="GitHub"><i class="fab fa-github"></i></a>`;
            html += '</div>';
            return html;
        }

        async function renderEquipe() {
            const container = document.getElementById('equipe-container');
            if (!container) return;
            container.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-pulse"></i> Carregando equipe...</div>';
            const orientadores = await loadJSON('data/orientadores.json');
            const membros = await loadJSON('data/membros.json');
            if (!orientadores || !membros) {
                container.innerHTML = '<p>Erro ao carregar dados da equipe.</p>';
                return;
            }
            orientadores.forEach(o => { orientadoresMap[o.id] = o; });
            allMembersForLinks = membros;
            container.innerHTML = '';
            for (const orientador of orientadores) {
                const membrosDoGrupo = membros.filter(m => m.orientador_id === orientador.id);
                const socialOri = renderSocialLinks(orientador);
                let projetosHtml = '';
                if (orientador.projetos && orientador.projetos.length) {
                    projetosHtml = '<div class="projetos-list"><strong>Projetos em destaque:</strong>';
                    orientador.projetos.forEach(p => {
                        projetosHtml += `<div class="projeto-item"><span class="projeto-titulo">${p.titulo}</span><br><span style="font-size:0.75rem;">${p.descricao.substring(0,150)}${p.descricao.length>150?'…':''}</span></div>`;
                    });
                    projetosHtml += '</div>';
                }
                const apresentacaoHtml = orientador.apresentacao ? `<div class="pesq-apresentacao">${orientador.apresentacao}</div>` : '';
                const grupoDiv = document.createElement('div');
                grupoDiv.className = 'grupo-pesquisador';
                grupoDiv.innerHTML = `
                    <div class="pesquisador-header">
                        <h3><i class="fas fa-chalkboard-user"></i> ${orientador.nome}</h3>
                        <p class="pesq-titulo">${orientador.titulo}</p>
                        <p><i class="fas fa-envelope"></i> ${orientador.email}</p>
                        ${socialOri}
                        ${apresentacaoHtml}
                        ${projetosHtml}
                    </div>
                    <div class="membros-grid" id="grid-${orientador.id}"></div>
                `;
                const grid = grupoDiv.querySelector(`#grid-${orientador.id}`);
                if (membrosDoGrupo.length === 0) {
                    grid.innerHTML = '<p class="instrucao">Nenhum aluno vinculado diretamente.</p>';
                } else {
                    membrosDoGrupo.forEach(m => {
                        const socialMembro = renderSocialLinks(m);
                        const coorientadorHtml = m.coorientador ? `<div class="coorientador"><i class="fas fa-user-friends"></i> Coorientador: ${m.coorientador}</div>` : '';
                        const card = document.createElement('div');
                        card.className = 'membro-card';
                        card.innerHTML = `
                            <i class="fas fa-user-graduate"></i>
                            <span class="nome">${m.nome}</span>
                            <div class="cargo">${m.vinculo}</div>
                            <div class="vinculo"><i class="fas fa-envelope"></i> ${m.email}</div>
                            ${coorientadorHtml}
                            ${socialMembro}
                        `;
                        grid.appendChild(card);
                    });
                }
                container.appendChild(grupoDiv);
            }
            const semOrientador = membros.filter(m => !m.orientador_id);
            if (semOrientador.length) {
                const title = document.createElement('h3');
                title.innerText = 'Pós-doutorandos e colaboradores';
                title.style.margin = '2rem 0 1rem';
                title.style.color = '#003f44';
                container.appendChild(title);
                const gridOutros = document.createElement('div');
                gridOutros.className = 'membros-grid';
                semOrientador.forEach(m => {
                    const socialMembro = renderSocialLinks(m);
                    const card = document.createElement('div');
                    card.className = 'membro-card';
                    card.innerHTML = `
                        <i class="fas fa-user-graduate"></i>
                        <span class="nome">${m.nome}</span>
                        <div class="cargo">${m.vinculo}</div>
                        <div class="vinculo"><i class="fas fa-envelope"></i> ${m.email}</div>
                        ${socialMembro}
                    `;
                    gridOutros.appendChild(card);
                });
                container.appendChild(gridOutros);
            }
        }

        async function renderEgressos() {
            const container = document.getElementById('egressos-container');
            if (!container) return;
            container.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-pulse"></i> Carregando egressos...</div>';
            const egressos = await loadJSON('data/egressos.json');
            if (!egressos || egressos.length === 0) {
                container.innerHTML = '<p>Nenhum egresso cadastrado.</p>';
                return;
            }
            container.innerHTML = '';
            const grid = document.createElement('div');
            grid.className = 'membros-grid';
            egressos.forEach(eg => {
                const card = document.createElement('div');
                card.className = 'egresso-card';
                card.innerHTML = `
                    <div class="nome">${eg.nome}</div>
                    <div class="info">${eg.vinculo_atual || ''} ${eg.tipo ? `(${eg.tipo})` : ''}</div>
                    <div class="info">Ano de saída: ${eg.ano_saida}</div>
                    ${eg.lattes ? `<div class="social-links"><a href="${eg.lattes}" target="_blank" title="Lattes"><i class="fab fa-lattes"></i></a></div>` : ''}
                `;
                grid.appendChild(card);
            });
            container.appendChild(grid);
        }

        async function renderParceiros() {
            const container = document.getElementById('parceiros-container');
            if (!container) return;
            container.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-pulse"></i> Carregando parceiros...</div>';
            const parceiros = await loadJSON('data/parceiros.json');
            if (!parceiros || parceiros.length === 0) {
                container.innerHTML = '<p>Nenhum parceiro cadastrado.</p>';
                return;
            }
            container.innerHTML = '';
            const grid = document.createElement('div');
            grid.className = 'parceiro-grid';
            parceiros.forEach(p => {
                const card = document.createElement('div');
                card.className = 'parceiro-card';
                card.innerHTML = `
                    <i class="fas fa-building"></i>
                    <span class="nome">${p.nome}</span>
                    <div class="tipo">${p.tipo}</div>
                    <div class="descricao">${p.descricao || ''}</div>
                    ${p.link ? `<a href="${p.link}" target="_blank" class="pub-link" style="display:inline-block; margin-top:0.5rem;">Visitar site <i class="fas fa-external-link-alt"></i></a>` : ''}
                `;
                grid.appendChild(card);
            });
            container.appendChild(grid);
        }

        async function renderPublicacoes() {
            const container = document.getElementById('publicacoes-container');
            if (!container) return;
            container.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-pulse"></i> Carregando publicações...</div>';
            const pubs = await loadJSON('data/publicacoes.json');
            if (!pubs || pubs.length === 0) {
                container.innerHTML = '<p>Nenhuma publicação cadastrada.</p>';
                return;
            }
            pubs.sort((a,b) => b.ano - a.ano);
            container.innerHTML = '';
            const lista = document.createElement('div');
            lista.className = 'publicacoes-lista';
            for (const pub of pubs) {
                let linkUrl = pub.link || (pub.doi ? `https://doi.org/${pub.doi}` : '');
                let pdfLink = pub.pdf ? `<a href="${pub.pdf}" target="_blank" class="pub-link pdf-link"><i class="fas fa-file-pdf"></i> Baixar PDF</a>` : '';
                let onlineLink = linkUrl ? `<a href="${linkUrl}" target="_blank" class="pub-link"><i class="fas fa-external-link-alt"></i> Acessar online</a>` : '';
                let autoresHtml = '';
                if (pub.autores_detalhes && pub.autores_detalhes.length) {
                    const autoresLinks = [];
                    for (const autor of pub.autores_detalhes) {
                        let nomeAutor = autor.nome;
                        let id = autor.id;
                        if (id && orientadoresMap[id]) {
                            autoresLinks.push(`<a href="#equipe">${nomeAutor}</a>`);
                        } else {
                            let found = false;
                            for (let m of allMembersForLinks) {
                                if (m.nome === nomeAutor) {
                                    autoresLinks.push(`<a href="#equipe">${nomeAutor}</a>`);
                                    found = true;
                                    break;
                                }
                            }
                            if (!found) autoresLinks.push(nomeAutor);
                        }
                    }
                    autoresHtml = autoresLinks.join('; ');
                } else {
                    autoresHtml = pub.autores || '';
                }
                const pubDiv = document.createElement('div');
                pubDiv.className = 'publicacao';
                pubDiv.innerHTML = `
                    <div class="pub-year">${pub.ano}</div>
                    <div class="pub-detalhe">
                        <h4>${pub.titulo}</h4>
                        <p class="pub-autores">${autoresHtml}</p>
                        <p class="pub-periodico"><em>${pub.periodico}</em> ${pub.volume ? `, ${pub.volume}` : ''} ${pub.paginas ? `, ${pub.paginas}` : ''}</p>
                        ${pub.resumo ? `<p class="pub-resumo">${pub.resumo}</p>` : ''}
                        <div class="pub-actions">${onlineLink}${pdfLink}</div>
                    </div>
                `;
                lista.appendChild(pubDiv);
            }
            container.appendChild(lista);
        }

        // Inicializar tudo
        async function init() {
            await loadAllComponents();
            // As funções dinâmicas não dependem dos componentes estáticos, podem rodar em paralelo
            await renderEquipe();
            await renderEgressos();
            await renderParceiros();
            await renderPublicacoes();
        }
        init();
    </script>
</body>
</html>
